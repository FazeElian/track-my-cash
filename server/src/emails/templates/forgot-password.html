<!DOCTYPE html>
<html>
    <head>
        <!-- Styles -->
        <style>
            /* Lexend font */
            @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap');

            * {
                box-sizing: border-box;
                margin: 0;
            }

            body {
                padding: 0;
                margin: 0;
                font-family: "Lexend", sans-serif;
            }

            section {
                display: flex;
                width: 100%;
                height: auto;
                flex-direction: column;
                text-align: center;
                padding: 3rem 2rem 3rem;
                align-items: center;
            }

            img {
                width: 30%;
                min-width: 300px;
                max-width: 600px;
                border-bottom: 2px solid #24BF67;
                padding: 0 2rem 0;
            }

            h1 {
                font-size: 24px;
                font-weight: 450;
                margin: 2rem 0 22px;
            }

            p {
                font-size: 15px;
                font-weight: 400;
                line-height: 22px;
            }

            .code {
                display: flex;
                width: auto;
                height: auto;
                margin: 22px 0 2rem;
                gap: 7px;
                padding: 1rem 1.5rem 1rem;
                border-radius: 6px;
                background-color: #2EA662;
                color: white;
                font-size: 24px;
                font-weight: 400;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
            }

                .code b {
                    font-weight: 550;
                }

            .btn {
                display: flex;
                width: auto;
                height: auto;
                text-align: center;
                padding: 14px 2rem 14px;
                text-decoration: none;
                color: #213440;
                font-weight: 450;
                border-radius: 12px;
                color: transparent;
                background: linear-gradient(
                    90deg, #3D90D9, 
                    #2EA662, #3D90D9
                );
                background-size: 200% 100%;
                background-position: 100% 50%;
                -webkit-background-clip: text;
                animation: gradientMovement 10s ease infinite;
                border: 2px solid #19937B;
                font-size: 16px;
            }


            @keyframes gradientMovement {
                0% {
                    background-position: 200% 0%;
                }
                50% {
                    background-position: -200% 0%;
                }
                100% {
                    background-position: 200% 0%;
                }
            }
        </style>
    </head>
    <body>
        <section>
            <img src="https://track-my-cash.netlify.app/assets/Logo-BeyKgpRd.webp" alt="Logo">
            <h1> Hola {{ userName }}, </h1>
            <p>
                Recientemente solicitaste restablecer tu contraseña para tu cuenta de Track My Cash. <br />
                Usa el código a continuación para restablecerla:
            </p>
            <div class="code">
                <b>CÓDIGO: </b>
                {{ code }}
            </div>
            <a href="{{ ValidateCodeURL }}" class="btn">Reestablecer mi contraseña</a>
        </section>
    </body>
</html>
